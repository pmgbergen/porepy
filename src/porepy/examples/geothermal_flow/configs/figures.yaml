# This YAML file defines the configuration for generating all figures in the geothermal flow paper. 
# Each figure has a type that determines the sequence of steps to generate it, and each step has its 
# own configuration. The scripts specified in this file are responsible for performing the necessary 
# data extraction, rendering, and plotting to produce the final figures.

# NOTE: To be used inside docker container.
# geothermal_flow/configs/figures.yaml

pvbatch: /opt/paraview/bin/pvbatch

cases:
  benchmark:
    pvd: visualization/benchmark/benchmark.pvd
  example1:
    pvd: visualization/example1/example1.pvd
  example2:
    pvd: visualization/example2/example2.pvd
  example3:
    pvd: visualization/example3/example3.pvd

studies:
  obl_study:
    tables: geothermal_flow/obl_convergence_analysis/tables_experiment_a
    cost: geothermal_flow/obl_convergence_analysis/experiment_c/cost.json
  mms_cartesian:
    results: geothermal_flow/cf_convergence_analysis/mms_halite_output/mms_results_cartesian.json
  mms_simplex_ensemble:
    results: geothermal_flow/cf_convergence_analysis/mms_halite_output/mms_results_ensemble_simplex.json


figures:
  figure6:
    type: benchmark_reference_then_matplotlib

    porepy_extract:
      script: geothermal_flow/paraview_scripts/extract_benchmark_profile.py
      pvd: visualization/benchmark/benchmark.pvd
      out_csv: csv/benchmark/porepy_benchmark_profile.csv
      time_index: -1
      pvd_time_unit: years
      gas_zero_threshold: 0.1

    matplotlib_plot:
      script: geothermal_flow/benchmark/plotting/plot_benchmark_comparison.py
      porepy_csv: csv/benchmark/porepy_benchmark_profile.csv
      reference_dir: geothermal_flow/benchmark/reference_data
      output: figures/benchmark/figure6.png
      simulation_time_years: 2000
      residual_liquid_saturation: 0.3
      vl_region: [0.47, 1.28]
      lh_region: [1.40, 2.00]

  figure7:
    type: python_module_then_collect
    steps:
      - module: porepy.examples.geothermal_flow.obl_convergence_analysis.run_experiment_a
        args: [--stage, compare]
    collect:
      geothermal_flow/obl_convergence_analysis/figures_experiment_a/errors_bulk_clean_extend_q_False.png: figures/obl/figure7a.png
      geothermal_flow/obl_convergence_analysis/figures_experiment_a/errors_bulk_clean_extend_q_False.pdf: figures/obl/figure7a.pdf
      geothermal_flow/obl_convergence_analysis/figures_experiment_a/errors_boundary_clean_extend_q_False.png: figures/obl/figure7b.png
      geothermal_flow/obl_convergence_analysis/figures_experiment_a/errors_boundary_clean_extend_q_False.pdf: figures/obl/figure7b.pdf

  figure8:
    type: python_module_then_collect
    steps:
      - module: porepy.examples.geothermal_flow.obl_convergence_analysis.run_experiment_c
        args: [--stage, figure]
    collect:
      geothermal_flow/obl_convergence_analysis/figures_experiment_c/cost_against_error_offline_online.png: figures/obl/figure8.png
      geothermal_flow/obl_convergence_analysis/figures_experiment_c/cost_against_error_offline_online.pdf: figures/obl/figure8.pdf

  
  figure10:
    type: paraview_time_series_then_matplotlib

    paraview_render:
      script: geothermal_flow/paraview_scripts/render_state_time_series.py
      state: geothermal_flow/paraview_states/example1/phz_column.pvsm
      pvd: visualization/example1/example1.pvd
      out_dir: figures/example1/figure10_panels
      times_days: [10, 74]
      output_prefix: phz_column
      width: 2200
      height: 3000
      save_layout: true
      update_all_pvd_readers: true

    matplotlib_plot:
      script: geothermal_flow/plotting/assemble_column_phz.py
      left: figures/example1/figure10_panels/phz_column_t_10_days.png
      right: figures/example1/figure10_panels/phz_column_t_74_days.png
      output: figures/example1/figure10.png
      gap: 40
      pad: 20
      background: white
  
  figure11: #centerline_profiles
    type: csv_then_matplotlib

    paraview_extract:
      script: geothermal_flow/paraview_scripts/extract_fracture_line_from_state.py
      state: geothermal_flow/paraview_states/example1/plot_overline_y_15.pvsm
      pvd: visualization/example1/example1.pvd
      out_dir: csv/example1/plotover_line
      time_index: -1
      output_name: plot_overline_y_15.csv
      source_name: PlotOverLine1
      field_association: "Point Data"

    matplotlib_plot:
      script: geothermal_flow/plotting/plot_centerline_profiles.py
      input_csv: csv/example1/plotover_line/plot_overline_y_15.csv
      output: figures/example1/figure11.png
      legend_loc: upper center

      smoothing:
        enabled: true
        range: [0.0, 10.0]
        variables: ["enthalpy", "s_gas", "z_NaCl"]
        starting_values:
          enthalpy: 1.197e6
          s_gas: 0.388
          z_NaCl: 0.25
  
  figure12:  #phase_saturations_permeability_ratio
    type: paraview_layout_png
    script: geothermal_flow/paraview_scripts/render_state_subplots.py
    state: geothermal_flow/paraview_states/example1/vap_hal_sat_permeability_ratio.pvsm
    pvd: visualization/example1/example1.pvd
    out: figures/example1/figure12.png
    time_index: -1
    save_layout: true
    update_all_pvd_readers: true
  
  figure13:  #halite_saturation_progression
    type: paraview_time_series_then_matplotlib

    paraview_render:
      script: geothermal_flow/paraview_scripts/render_state_time_series.py
      state: geothermal_flow/paraview_states/example1/hal_sat_panel.pvsm
      pvd: visualization/example1/example1.pvd
      out_dir: figures/example1/s_halite_panels
      times_days: [1, 10, 30, 74]

    matplotlib_plot:
      script: geothermal_flow/plotting/assemble_s_halite_panels.py
      panel_dir: figures/example1/s_halite_panels
      output: figures/example1/figure13.png
      colorbar_label: "$\\mathbf{s}^{\\mathbf{hal}}$"
      vmin: 0.0
      vmax: 0.21
      cmap: coolwarm
  
  figure14:  #fracture_halite_aperture
    type: csv_then_matplotlib

    paraview_extract:
      script: geothermal_flow/paraview_scripts/extract_fracture_line_from_state.py
      state: geothermal_flow/paraview_states/example1/fracture_line_data.pvsm
      pvd: visualization/example1/example1.pvd
      out_dir: csv/example1/fracture_line
      times_days: [0, 0.6, 10, 30, 74]
      source_name: CellCenters1
      field_association: "Point Data"

    matplotlib_plot:
      script: geothermal_flow/plotting/plot_halite_aperture_ratio.py
      input_dir: csv/example1/fracture_line
      output: figures/example1/figure14.png
      times_days: [0, 0.6, 10, 30, 74]
      clogging_exponent: 0.1
      aperture_ymin: 0.9935
      aperture_ymax: 1.0001
      x_col: "Points:0"
      y_col: "Points:1"
    
  figure15:  # fracture_halite_aperture_phi_1:
    type: csv_then_matplotlib

    paraview_extract:
      script: geothermal_flow/paraview_scripts/extract_fracture_line_from_state.py
      state: geothermal_flow/paraview_states/example2/fracture_line_data.pvsm
      pvd: visualization/example2/example2.pvd
      out_dir: csv/example2/fracture_line
      times_days: [0, 0.5, 2.0, 7]
      source_name: CellCenters1
      field_association: "Point Data"

    matplotlib_plot:
      script: geothermal_flow/plotting/plot_halite_aperture_ratio.py
      input_dir: csv/example2/fracture_line
      output: figures/example2/figure15.png
      times_days: [0, 0.5, 2.0, 7]
      clogging_exponent: 0.1
      aperture_ymin: 0.985
      aperture_ymax: 1.002
      x_col: "Points:0"
      y_col: "Points:1"
  
  figure16:  #near_well_halite_comparison
    type: paraview_comparison_then_matplotlib

    paraview_render:
      script: geothermal_flow/paraview_scripts/render_state_time_series.py

      panels:
        q_inj_0_28:
          state: geothermal_flow/paraview_states/example1/near_well_hal_sat.pvsm
          pvd: visualization/example1/example1.pvd
          out_dir: figures/example1/near_well_panels_q_inj_0_2_8
          times_days: [7]

        q_inj_0_364:
          state: geothermal_flow/paraview_states/example2/near_well_hal_sat.pvsm
          pvd: visualization/example2/example2.pvd
          out_dir: figures/example2/near_well_panels_q_inj_0_3_6_4
          times_days: [7]

    matplotlib_plot:
      script: geothermal_flow/plotting/plot_near_well_comparison.py
      left: figures/example1/near_well_panels_q_inj_0_2_8/s_halite_t_7_days.png
      right: figures/example2/near_well_panels_q_inj_0_3_6_4/s_halite_t_7_days.png
      output: figures/example2/figure16.png
      labels:
        left: "$q_{\\mathrm{inj}} = 0.28~\\mathrm{kg}\\,\\mathrm{m}^{-3}\\,\\mathrm{s}^{-1}$"
        right: "$q_{\\mathrm{inj}} = 0.364~\\mathrm{kg}\\,\\mathrm{m}^{-3}\\,\\mathrm{s}^{-1}$"
      colorbar:
        field: "$\\mathbf{s}^{\\mathbf{hal}}$"
        vmin: 0.0
        vmax: 0.5

  figure17:  #production_diagnostics
    type: pvd_timeseries_then_matplotlib

    data_extract:
      script: geothermal_flow/paraview_scripts/extract_well_time_series_data.py
      cases:
        q_inj_0_28:
          pvd: visualization/example1/example1.pvd
          cell_id: 3379
          variables: ["pressure", "s_halite", "s_gas", "z_NaCl", "enthalpy"]
          cache: output/example1/production_cell_timeseries.csv
          diagnostics_cache: output/example1/production_diagnostics.csv
          shape: triangle
          block_filter: example1_2
          max_time_days: 7.0
          force_reextract: true

        q_inj_0_364:
          pvd: visualization/example2/example2.pvd
          cell_id: 3379
          variables: ["pressure", "s_halite", "s_gas", "z_NaCl", "enthalpy"]
          cache: output/example2/production_cell_timeseries.csv
          diagnostics_cache: output/example2/production_diagnostics.csv
          shape: triangle
          block_filter: example2_2
          max_time_days: 7.0
          force_reextract: true

    matplotlib_plot:
      script: geothermal_flow/plotting/plot_production_diagnostics.py
      q_inj_0_28: output/example1/production_diagnostics.csv
      q_inj_0_364: output/example2/production_diagnostics.csv
      output: figures/example2/figure17.png
      t_min: 2.0
      t_max: 7.0
      q_ymin: 0.0
      q_ymax: 0.008
      energy_ymin: 0.0
      energy_ymax: 7000.0

  figure18:  #phz_fields_example3
    type: paraview_time_series_then_matplotlib

    paraview_render:
      script: geothermal_flow/paraview_scripts/render_state_time_series.py
      state: geothermal_flow/paraview_states/example3/phz_column.pvsm
      pvd: visualization/example3/example3.pvd
      out_dir: figures/example3/figure18_panels
      times_days: [10, 60]
      output_prefix: phz_column
      width: 2200
      height: 3000
      save_layout: true
      update_all_pvd_readers: true

    matplotlib_plot:
      script: geothermal_flow/plotting/assemble_column_phz.py
      left: figures/example3/figure18_panels/phz_column_t_10_days.png
      right: figures/example3/figure18_panels/phz_column_t_60_days.png
      output: figures/example3/figure18.png
      gap: 40
      pad: 20
      background: white

  figure19:  #centerline_profiles
    type: csv_then_matplotlib
    paraview_extract:
      script: geothermal_flow/paraview_scripts/extract_fracture_line_from_state.py
      state: geothermal_flow/paraview_states/example3/plot_overline_y_16.pvsm
      pvd: visualization/example3/example3.pvd
      out_dir: csv/example3/plotover_line
      time_index: -1
      output_name: plot_overline_y_16.csv
      source_name: PlotOverLine1
      field_association: "Point Data"
    matplotlib_plot:
      script: geothermal_flow/plotting/plot_centerline_profiles.py
      input_csv: csv/example3/plotover_line/plot_overline_y_16.csv
      output: figures/example3/figure19.png
      legend_loc: center

  figure20:  #phase_saturations
    type: paraview_layout_png
    script: geothermal_flow/paraview_scripts/render_state_subplots.py
    state: geothermal_flow/paraview_states/example3/vap_hal_sat.pvsm
    pvd: visualization/example3/example3.pvd
    out: figures/example3/figure20.png
    time_index: -1
    save_layout: true
    update_all_pvd_readers: true

  figure21:
    type: python_module_then_collect
    steps:
      - module: porepy.examples.geothermal_flow.cf_convergence_analysis.plot_mms_fields
        args: [geothermal_flow/cf_convergence_analysis/mms_halite_output/mms_results_ensemble_simplex.json]
    collect:
      geothermal_flow/cf_convergence_analysis/mms_halite_output/exact_vs_computed_ensemble_simplex.png: figures/mms/figure21.png

  figure22:
    type: python_module_then_collect
    steps:
      - module: porepy.examples.geothermal_flow.cf_convergence_analysis.plot_mms_fields
        args: [geothermal_flow/cf_convergence_analysis/mms_halite_output/mms_results_cartesian.json]
      - module: porepy.examples.geothermal_flow.cf_convergence_analysis.plot_mms_fields
        args: [geothermal_flow/cf_convergence_analysis/mms_halite_output/mms_results_ensemble_simplex.json]
    matplotlib_plot:
      script: geothermal_flow/plotting/assemble_vertical_panels.py
      top: geothermal_flow/cf_convergence_analysis/mms_halite_output/convergence_cartesian.png
      bottom: geothermal_flow/cf_convergence_analysis/mms_halite_output/convergence_ensemble_simplex.png
      output: figures/mms/figure22.png
      gap: 40
      pad: 20
      background: white
