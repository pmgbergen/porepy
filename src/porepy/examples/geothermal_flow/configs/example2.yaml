# Example 2: same disconnected fracture network, stronger halite-aperture feedback.
# Paper case: φ = 0.1, a0 = 1e-3 m, 7 days.

case_name: example2
geometry: disconnected

physics:
  clogging_exponent: 0.1
  reference_aperture: 1.0e-3
  injection_fraction: 1.3

vtk:
  phz_file: XHP_l2_original_salt_new.vtk

time:
  end: 648000.0         # 7 days [s]
  dt_init: 180.0        # 3 minutes [s]
  dt_min: 1.0           # [s]
  dt_max: 600.0         # 10 minutes [s]
  iter_optimal: [20, 25]
  iter_relax: [0.75, 2.0]

solver:
  use_line_search: true
  use_anderson: true    # NOTE: Works with or without anderson. For testing it is set true.     
  anderson_acceleration_constrained: false
  use_appleyard_chop: false
