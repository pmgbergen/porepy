name: Build and deploy documentation

on:
  push:
    branches:
      - develop
  workflow_dispatch:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/develop'
    steps:
      - name: Check out revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended

      - name: Install PorePy and documentation dependencies
        run: |
          python -m pip install -e ".[docs]"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build HTML and PDF documentation
        # Do not pass Sphinx -W: incomplete API docstring warnings are non-fatal.
        # Sphinx errors and missing PDF output still fail make full.
        run: make full SPHINXOPTS= O=
        working-directory: docs

      - name: Upload HTML site
        uses: actions/upload-pages-artifact@v5
        with:
          name: GH-PAGES-${{ github.sha }}
          path: docs/_build/html
          retention-days: 30
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    name: Deploy documentation to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the commit's HTML artifact
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: GH-PAGES-${{ github.sha }}
